# Enable KVM for Android tests on Linux
parameters:
  # Optional extra condition to AND with the default KVM condition.
  # Used by ui-tests-steps.yml to also gate on SHOULD_RUN_TESTS for category-skip optimization.
  extraCondition: ''

steps:
- bash: |
    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
    sudo udevadm control --reload-rules
    sudo udevadm trigger --name-match=kvm
  displayName: Enable KVM
  ${{ if eq(parameters.extraCondition, '') }}:
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
  ${{ else }}:
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), ${{ parameters.extraCondition }})
